services:
  postgres:
    image: postgres:17-alpine
    container_name: lavague-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lavague
      POSTGRES_PASSWORD: lavague
      POSTGRES_DB: lavague
    ports:
      - "5432:5432"
    volumes:
      - lavague-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lavague"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lavague-pgdata:
